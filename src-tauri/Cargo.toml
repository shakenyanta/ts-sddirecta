[package]
name = "ts-sddirecta"
version = "0.1.3"
description = "A Tauri + Vite + Vue 3 desktop application"
authors = []
edition = "2021"

[lib]
name = "ts_navigator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
sha2 = "0.10"
tempfile = "3"
windows-sys = { version = "0.52", features = [
	"Win32_Foundation",
	"Win32_Security_Cryptography",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
	"Win32_Storage_FileSystem",
	"Win32_System_Ioctl",
	"Win32_System_IO",
	"Win32_System_Threading",
	"Win32_System_Registry",
	"Win32_System_Com",
	"Win32_System_SystemServices",
] }
tracing = "0.1"

# Portable exe: optimize size without changing panic/unwind behavior.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
